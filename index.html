<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kaiwena.github.io</title>
<style>
:root {
  --bg: #EEF3F6;
  --surface: #FFFFFF;
  --ink: #12222C;
  --ink-2: #4B5E6A;
  --line: #C6D3DB;
  --accent: #0B7285;
  --accent-soft: rgba(11, 114, 133, 0.10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1920;
    --surface: #15242D;
    --ink: #E6EEF2;
    --ink-2: #9DB1BD;
    --line: #2E4553;
    --accent: #3CC4D8;
    --accent-soft: rgba(60, 196, 216, 0.14);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 40px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
}
main { max-width: 640px; margin: 0 auto; }
.site { margin: 0 0 4px; color: var(--ink-2); font-size: 0.9rem; letter-spacing: 0.04em; }
h1 { margin: 0 0 20px; font-size: clamp(1.7rem, 6vw, 2.2rem); line-height: 1.15; letter-spacing: -0.01em; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
a {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 16px; min-height: 52px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px;
  text-decoration: none;
}
a:hover { border-color: var(--accent); background: var(--accent-soft); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.name { font-weight: 600; font-size: 1.05rem; }
.file { color: var(--ink-2); font-size: 0.85rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <p class="site">kaiwena.github.io</p>
  <h1>Pages</h1>
  <ul id="pages">
    <li><a href="organism-simulation.html"><span class="name">Organism Grid Simulation</span><span class="file">organism-simulation.html</span></a></li>
    <li><a href="unit-circle.html"><span class="name">Unit Circle Explorer</span><span class="file">unit-circle.html</span></a></li>
  </ul>
</main>

<script>
/* The list above always works. This also adds any other .html page in the repo,
   named from its file name, so a new page shows up without editing this file. */
(function () {
  var list = document.getElementById('pages');
  var known = {};
  Array.prototype.forEach.call(list.querySelectorAll('a'), function (a) { known[a.getAttribute('href')] = true; });
  fetch('https://api.github.com/repos/kaiwena/kaiwena.github.io/contents/')
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (items) {
      items.forEach(function (it) {
        if (it.type !== 'file' || !/\.html$/i.test(it.name) || it.name === 'index.html' || known[it.name]) return;
        var title = it.name.replace(/\.html$/i, '').replace(/[-_]+/g, ' ');
        title = title.charAt(0).toUpperCase() + title.slice(1);
        var li = document.createElement('li'), a = document.createElement('a');
        var n = document.createElement('span'), f = document.createElement('span');
        a.href = it.name; n.className = 'name'; n.textContent = title; f.className = 'file'; f.textContent = it.name;
        a.appendChild(n); a.appendChild(f); li.appendChild(a); list.appendChild(li);
      });
    })
    .catch(function () { /* keep the static list */ });
})();
</script>
</body>
</html>
