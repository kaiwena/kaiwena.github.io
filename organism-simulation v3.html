<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organism Grid Simulation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #f5f2eb;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: normal;
    letter-spacing: 0.02em;
    margin-bottom: 0.25rem;
    color: #1a1a1a;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 1.75rem;
    font-style: italic;
  }

  .layout {
    display: flex;
    gap: 2rem;
    align-items: flex-start;
    flex-wrap: wrap;
    max-width: 860px;
    margin: 0 auto;
  }

  .grid-section { flex: 0 0 auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 30px);
    grid-template-rows: repeat(12, 30px);
    gap: 3px;
    background: #d6d0c4;
    padding: 3px;
    border-radius: 6px;
  }

  .cell {
    width: 30px;
    height: 30px;
    border-radius: 3px;
    background: #ede9e0;
    transition: background 0.12s ease;
  }

  .cell.filled  { background: #005a9e; }
  .cell.new     { background: #e6a817; }

  .panel {
    flex: 1;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .stat {
    background: #fff;
    border: 1px solid #d6d0c4;
    border-radius: 6px;
    padding: 10px 12px;
  }

  .stat-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 22px;
    font-weight: bold;
    color: #1a1a1a;
    font-family: 'Courier New', monospace;
  }

  .controls {
    display: flex;
    gap: 10px;
  }

  button {
    cursor: pointer;
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 9px 20px;
    border-radius: 5px;
    border: 1px solid #aaa;
    background: #fff;
    color: #1a1a1a;
    transition: background 0.1s, border-color 0.1s;
  }

  button:hover { background: #ede9e0; border-color: #888; }
  button:active { transform: scale(0.98); }

  button.primary {
    background: #005a9e;
    color: #fff;
    border-color: #004480;
  }

  button.primary:hover { background: #004480; }

  .log {
    font-size: 12px;
    color: #666;
    font-style: italic;
    min-height: 1.4em;
    line-height: 1.5;
  }

  .legend {
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: #555;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .table-wrap {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid #d6d0c4;
    border-radius: 6px;
    background: #fff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    font-family: 'Courier New', monospace;
  }

  thead th {
    position: sticky;
    top: 0;
    background: #ede9e0;
    padding: 8px 16px;
    text-align: left;
    font-family: Georgia, serif;
    font-weight: normal;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #666;
    border-bottom: 1px solid #d6d0c4;
  }

  tbody td {
    padding: 6px 16px;
    border-bottom: 1px solid #ede9e0;
    color: #1a1a1a;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f5f2eb; }

  .header { max-width: 860px; margin: 0 auto 0; }
</style>
</head>
<body>

<div class="header">
  <h1>Organism Grid Simulation</h1>
  <p class="subtitle">A 12×12 habitat. Each generation, one roll per organism.</p>
</div>

<div class="layout">
  <div class="grid-section">
    <div class="grid" id="grid" role="img" aria-label="12 by 12 organism grid"></div>
  </div>

  <div class="panel">
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Generation</div>
        <div class="stat-value" id="gen-num">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Organisms</div>
        <div class="stat-value" id="org-count">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Rolls</div>
        <div class="stat-value" id="rolls-num">—</div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" onclick="step()">Next generation</button>
      <button onclick="reset()">Reset</button>
    </div>

    <div class="log" id="log"></div>

    <div class="legend">
      <div class="legend-item"><div class="swatch" style="background:#005a9e"></div>Organism (stable)</div>
      <div class="legend-item"><div class="swatch" style="background:#e6a817"></div>Newly placed</div>
      <div class="legend-item"><div class="swatch" style="background:#ede9e0; border:1px solid #ccc"></div>Empty</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Generation</th><th>Organisms</th></tr></thead>
        <tbody id="hist-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const ROWS = 12, COLS = 12;
let grid, generation, lastNews;

function rollDie() { return Math.floor(Math.random() * 12); }

function buildGrid() {
  const container = document.getElementById('grid');
  container.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'c' + r + '_' + c;
      container.appendChild(cell);
    }
  }
}

function renderGrid() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = document.getElementById('c' + r + '_' + c);
      const isNew = lastNews.some(function(n){ return n[0]===r && n[1]===c; });
      if (isNew)          { el.className = 'cell new'; }
      else if (grid[r][c]){ el.className = 'cell filled'; }
      else                { el.className = 'cell'; }
    }
  }
}

function countOrgs() {
  var n = 0;
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (grid[r][c]) n++;
  return n;
}

function addRow(gen, count) {
  var tbody = document.getElementById('hist-body');
  var tr = document.createElement('tr');
  tr.innerHTML = '<td>' + gen + '</td><td>' + count + '</td>';
  tbody.appendChild(tr);
  tbody.parentElement.scrollTop = tbody.parentElement.scrollHeight;
}

function step() {
  lastNews = [];

  if (generation === 0) {
    var placed = new Set();
    while (placed.size < 12) {
      var r = rollDie(), c = rollDie();
      var key = r * 12 + c;
      if (!placed.has(key)) {
        placed.add(key);
        grid[r][c] = true;
        lastNews.push([r, c]);
      }
    }
    generation = 1;
    var xc = countOrgs();
    document.getElementById('gen-num').textContent = generation;
    document.getElementById('org-count').textContent = xc;
    document.getElementById('rolls-num').textContent = 12;
    document.getElementById('log').textContent = 'Generation 1: 12 unique cells filled — ' + xc + ' organisms on board.';
    addRow(generation, xc);

  } else {
    var before = countOrgs();
    var numRolls = before;
    var removed = 0, added = 0;
    for (var i = 0; i < numRolls; i++) {
      var r = rollDie(), c = rollDie();
      if (grid[r][c]) {
        grid[r][c] = false;
        var ni = lastNews.findIndex(function(n){ return n[0]===r && n[1]===c; });
        if (ni !== -1) lastNews.splice(ni, 1);
        removed++;
      } else {
        grid[r][c] = true;
        lastNews.push([r, c]);
        added++;
      }
    }
    generation++;
    var xc = countOrgs();
    document.getElementById('gen-num').textContent = generation;
    document.getElementById('org-count').textContent = xc;
    document.getElementById('rolls-num').textContent = numRolls;
    document.getElementById('log').textContent = 'Generation ' + generation + ': ' + numRolls + ' rolls — +' + added + ' added, −' + removed + ' removed — ' + xc + ' organisms.';
    addRow(generation, xc);
  }

  renderGrid();
}

function reset() {
  grid = [];
  for (var r = 0; r < ROWS; r++) { grid[r] = []; for (var c = 0; c < COLS; c++) grid[r][c] = false; }
  generation = 0;
  lastNews = [];
  document.getElementById('gen-num').textContent = 0;
  document.getElementById('org-count').textContent = 0;
  document.getElementById('rolls-num').textContent = '—';
  document.getElementById('log').textContent = '';
  document.getElementById('hist-body').innerHTML = '';
  renderGrid();
}

function init() {
  grid = [];
  for (var r = 0; r < ROWS; r++) { grid[r] = []; for (var c = 0; c < COLS; c++) grid[r][c] = false; }
  generation = 0;
  lastNews = [];
  buildGrid();
  renderGrid();
}

init();
</script>
</body>
</html>
